steps:
  # Build the container image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/birdwatcher-frontend:$SHORT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/birdwatcher-frontend:latest'
      - '.'
    dir: 'frontend'

  # Push the container image to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/birdwatcher-frontend:$SHORT_SHA'

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/birdwatcher-frontend:latest'

  # Deploy container image to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'birdwatcher-frontend'
      - '--image'
      - 'gcr.io/$PROJECT_ID/birdwatcher-frontend:$SHORT_SHA'
      - '--region'
      - '${_REGION}'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--port'
      - '6060'
      - '--set-env-vars'
      - 'BACKEND_URL=${_BACKEND_URL}'

images:
  - 'gcr.io/$PROJECT_ID/birdwatcher-frontend:$SHORT_SHA'
  - 'gcr.io/$PROJECT_ID/birdwatcher-frontend:latest'

substitutions:
  _REGION: us-central1
  _BACKEND_URL: https://birdwatcher-backend-REPLACE_WITH_HASH.run.app

options:
  logging: CLOUD_LOGGING_ONLY
